<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="__DESCRIPTION__">
  <title>__TITLE__</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { --ink:#181818; --soft:#717171; --line:#e7e7e5; }
    * { box-sizing:border-box; } html,body { background:#fff; } body { margin:0; color:var(--ink); font-family:Inter, Pretendard, "Noto Sans KR", Arial, sans-serif; -webkit-font-smoothing:antialiased; } button,a { font:inherit; }
    .page { width:min(1160px, calc(100% - 32px)); margin:0 auto; padding:44px 0 74px; }.hero { text-align:center; margin:10px auto 34px; max-width:940px; }.eyebrow { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; color:#9b470d; background:#fff4ec; font:700 12px/1 ui-monospace,monospace; letter-spacing:.04em; }.eyebrow::before { content:""; width:7px; height:7px; border-radius:50%; background:#e56b12; }h1 { margin:20px 0 16px; font-size:clamp(36px,5vw,66px); line-height:1.07; letter-spacing:-.075em; font-weight:800; }.intro { max-width:850px; margin:0 auto; color:var(--soft); font-size:18px; line-height:1.8; letter-spacing:-.025em; }.intro strong { color:var(--ink); font-weight:800; }.source { margin:20px auto 0; color:#343434; font:600 12px/1.65 ui-monospace,monospace; }
    .tabs { display:flex; justify-content:center; gap:8px; margin:28px 0 0; }.tabs[hidden] { display:none; }.tab { min-height:42px; padding:0 17px; color:#5f5f5f; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; font-size:14px; font-weight:750; }.tab[aria-selected="true"],.filter.is-active { color:#fff; border-color:#151515; background:#151515; }.tab:focus-visible,.filter:focus-visible,.action:focus-visible { outline:3px solid #7eb6ff; outline-offset:3px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); overflow:hidden; margin:35px 0 21px; border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.03); }.stat { min-height:90px; display:grid; align-content:center; gap:9px; text-align:center; border-right:1px solid var(--line); }.stat:last-child { border-right:0; }.stat-label { color:#343434; font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; }.stat-value { color:#252525; font-size:25px; line-height:1; font-weight:800; letter-spacing:-.05em; white-space:nowrap; }
    .filters { display:grid; gap:12px; margin:20px auto 30px; }.filter-row { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; padding:4px 0; }.filter-label { color:#343434; text-align:right; font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; }.filter-group { display:flex; flex-wrap:wrap; gap:7px; }.filter { min-height:38px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 14px; color:#626262; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; font-size:13px; font-weight:720; }.filter-dot { width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--dot); }
    .quick-picks { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:0 0 18px; }.quick { padding:20px 17px; border:1px solid var(--line); border-radius:16px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.025); }.quick h2 { margin:0 0 9px; font-size:16px; letter-spacing:-.045em; }.quick p { margin:0; color:#6e6e6e; font-size:13px; line-height:1.62; letter-spacing:-.02em; }.quick strong { color:#333; font-weight:800; }
    .marker-section { margin:18px 0 16px; padding:19px 18px 18px; border:1px solid var(--line); border-radius:16px; }.marker-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }.marker-head h2 { margin:0; font-size:21px; letter-spacing:-.055em; }.marker-head p { margin:0; color:#181818; font:800 12px/1.5 Geist,Arial,sans-serif; text-align:right; }.marker-grid { position:relative; display:grid; grid-template-columns:repeat(auto-fit,minmax(74px,1fr)); gap:18px 7px; margin-top:27px; }.marker-grid::before { content:""; position:absolute; top:13px; left:2%; right:2%; height:1px; background:#dedede; }.marker { position:relative; z-index:1; min-width:0; text-align:center; color:#555; font-size:11px; line-height:1.35; }.marker-dot { width:25px; height:25px; margin:0 auto 4px; border:5px solid #fff; border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px #dedede; }.marker-distance { display:block; color:#181818; font:800 11px/1.25 Geist,Arial,sans-serif; }.marker-name { display:block; overflow:hidden; margin-top:1px; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
    .empty { display:none; padding:42px 18px; border:1px dashed #d5d5d5; border-radius:16px; color:#777; text-align:center; line-height:1.7; }.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:stretch; }.card { position:relative; display:flex; flex-direction:column; gap:14px; min-height:486px; padding:18px; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fff; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.025); }.rank { display:grid; place-items:center; width:38px; height:38px; margin:0 auto; border-radius:50%; color:#fff; background:var(--accent); font:700 14px/1 "Geist Mono"; }.card h2 { min-height:25px; margin:0; font-size:22px; line-height:1.12; letter-spacing:-.05em; }.meta,.menus { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }.meta { margin:0; }.chip { display:inline-flex; align-items:center; min-height:22px; padding:0 8px; border-radius:999px; background:#f4f4f4; color:#555; font:650 11px/1 "Geist Mono"; }.reason { min-height:0; margin:0; color:#5f5f5f; font-size:14px; line-height:1.6; }.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }.info { min-height:0; display:block; padding:11px; border:0; border-radius:12px; background:#fafafa; box-shadow:0 0 0 1px rgba(0,0,0,.06); }.info b { display:block; color:#999; font:650 11px/normal "Geist Mono"; }.info span { display:block; margin-top:5px; color:#242424; font:400 14px/20.3px Geist,Arial,"Apple SD Gothic Neo",sans-serif; }.menus { margin:0; gap:7px; }.menu { padding:7px 9px; border-radius:8px; background:#f2f2f2; color:#444; font-size:13px; font-weight:650; }.accent-rule { height:3px; margin:1px 0; background:var(--accent); }.rationale { min-height:0; margin:0 6px; color:#707070; font-size:14px; line-height:1.58; }.actions { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:0; }.action { display:inline-flex; min-height:40px; align-items:center; justify-content:center; padding:0 14px; border:1px solid #dfdfdf; border-radius:9px; color:#343434; background:#fff; text-decoration:none; font-size:13px; font-weight:800; }.action.primary { color:#fff; border-color:#151515; background:#151515; }.notice { margin-top:25px; padding:16px 18px; color:#777; border:1px solid var(--line); border-radius:14px; font-size:12px; line-height:1.7; }.address-line { white-space:nowrap; display:block; letter-spacing:-.03em; }
    @media (max-width:650px) { .page { width:min(100% - 28px,540px); padding:32px 0 52px; }.hero { margin-top:0; } h1 { margin:19px 0 13px; font-size:39px; }.intro { font-size:16px; line-height:1.75; }.source { padding:0 3px; font-size:10px; }.tabs { margin-top:22px; }.stats { grid-template-columns:1fr; margin-top:29px; }.stat { min-height:82px; border-right:0; border-bottom:1px solid var(--line); }.stat:last-child { border-bottom:0; }.stat-value { font-size:27px; }.filters { display:block; margin:20px 0 24px; }.filter-row { display:block; }.filter-label { margin:18px 0 7px; text-align:center; }.filter-label:first-child { margin-top:0; }.filter-group { display:grid; grid-template-columns:1fr; gap:5px; }.filter { width:100%; min-height:42px; font-size:14px; }.quick-picks { grid-template-columns:1fr; gap:10px; }.quick { padding:21px 18px; }.marker-section { padding:21px 12px; }.marker-head { display:block; text-align:center; }.marker-head p { margin-top:7px; text-align:center; }.marker-grid { grid-template-columns:repeat(3,1fr); gap:19px 7px; }.marker-grid::before { display:none; }.cards { grid-template-columns:1fr; gap:14px; }.card { padding:15px; border-radius:16px; }.rank { width:38px; height:38px; margin-bottom:0; font-size:14px; }.card h2 { font-size:20px; }.meta { margin-top:-4px; }.chip { min-height:23px; padding:3px 8px; font-size:11px; }.reason { margin:-2px 6px; font-size:13px; }.info-grid { grid-template-columns:1fr; gap:8px; }.accent-rule { margin:0; }.rationale { font-size:12px; }.action { min-height:40px; padding:0 13px; border-radius:9px; font-size:12px; } }
    /* Decision-message rail: pair cards share one fixed bottom baseline. */
    .cards { align-items:stretch; }
    .card { display:flex; flex-direction:column; min-height:486px; }
    .card h2 { min-height:25px; }
    .reason { min-height:23px; }
    .menus { min-height:34px; align-content:start; }
    .card-bottom { display:grid; grid-template-rows:3px 24px 40px; gap:14px; margin-top:auto; }
    .accent-rule { margin:0; }
    .rationale { display:flex; align-items:center; justify-content:center; min-height:24px; white-space:nowrap; }
    .actions { margin:0; }
    @media (max-width:650px) { .card { min-height:0; } .rationale { white-space:normal; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero"><div class="eyebrow" id="eyebrow"></div><h1>__TITLE__</h1><p class="intro">__INTRO__</p><p class="source" id="source"></p><div class="tabs" role="tablist" aria-label="추천 출처" id="tabs"></div></header>
    <section class="stats" aria-label="선택 결과 요약"><div class="stat"><span class="stat-label">CANDIDATES</span><strong class="stat-value" id="candidateCount"></strong></div><div class="stat"><span class="stat-label">RADIUS</span><strong class="stat-value" id="radiusValue"></strong></div><div class="stat"><span class="stat-label">CLOSEST</span><strong class="stat-value" id="closest"></strong></div><div class="stat"><span class="stat-label">BEST FOR</span><strong class="stat-value" id="bestFor"></strong></div></section>
    <section class="filters" aria-label="후보 필터"><div class="filter-row"><div class="filter-label">DISTANCE</div><div class="filter-group" id="distanceFilters"></div></div><div class="filter-row"><div class="filter-label">FOOD</div><div class="filter-group" id="foodFilters"></div></div></section>
    <section class="quick-picks" aria-label="빠른 선택" id="quickPicks"></section>
    <section class="marker-section" aria-labelledby="markerTitle"><div class="marker-head"><h2 id="markerTitle"></h2><p id="markerHelper"></p></div><div class="marker-grid" id="markerGrid"></div></section>
    <p class="empty" id="emptyState">선택한 조건에 맞는 후보가 없습니다.<br>거리 또는 음식 필터를 바꿔 보세요.</p><section class="cards" id="cardList" aria-live="polite"></section><footer class="notice" id="notice"></footer>
  </main>
  <script>
    const guide = __PAYLOAD_JSON__;
    const { config, modeConfig, venues } = guide;
    const modes = Object.keys(venues);
    const state = { mode: modes[0], distance: 'all', food: 'all' };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[character]);
    const searchUrl = (name) => `https://map.naver.com/p/search/${encodeURIComponent(name)}?c=15.00,0,0,0,dh`;
    function naverPlaceSearchUrl(name) { return `https://search.naver.com/search.naver?query=${encodeURIComponent(name)}`; }
    function modeVenues() { return venues[state.mode]; }
    function filteredVenues() { const limits = config.distanceFilters.filter((filter) => filter.value !== 'all' && Number.isFinite(Number(filter.value))).map((filter) => Number(filter.value)).sort((a,b) => a-b); return modeVenues().filter((venue) => { const selected = config.distanceFilters.find((filter) => filter.value === state.distance); const limit = Number(selected?.value); const previous = Number.isFinite(limit) ? (limits[limits.indexOf(limit) - 1] || 0) : (limits.at(-1) || 0); const distance = state.distance === 'all' || (Number.isFinite(limit) ? venue.distance > previous && venue.distance <= limit : venue.distance > previous); return distance && (state.food === 'all' || venue.category === state.food); }).sort((a,b) => a.distance-b.distance); }
    function buttonMarkup(type, value, label, color, active) { return `<button class="filter${active ? ' is-active' : ''}" type="button" data-${type}="${escapeHtml(value)}">${color ? `<span class="filter-dot" style="--dot:${escapeHtml(color)}"></span>` : ''}${escapeHtml(label)}</button>`; }
    function renderTabs() { const tabs = $('#tabs'); tabs.hidden = modes.length < 2; tabs.innerHTML = modes.map((mode) => `<button class="tab" type="button" role="tab" aria-selected="${mode === state.mode}" data-mode="${mode}">${escapeHtml(modeConfig[mode].label)}</button>`).join(''); tabs.querySelectorAll('[data-mode]').forEach((button) => button.addEventListener('click', () => { state.mode = button.dataset.mode; state.food = 'all'; render(); })); }
    function renderFilters() { $('#distanceFilters').innerHTML = config.distanceFilters.map((filter) => buttonMarkup('distance', filter.value, filter.label, filter.color, state.distance === filter.value)).join(''); const categories = [...new Map(modeVenues().map((venue) => [venue.category, venue.color])).entries()]; $('#foodFilters').innerHTML = buttonMarkup('food', 'all', '전체', null, state.food === 'all') + categories.map(([category,color]) => buttonMarkup('food', category, category, color, state.food === category)).join(''); document.querySelectorAll('[data-distance]').forEach((button) => button.addEventListener('click', () => { state.distance = button.dataset.distance; render(); })); document.querySelectorAll('[data-food]').forEach((button) => button.addEventListener('click', () => { state.food = button.dataset.food; render(); })); }
    function cardMarkup(venue, rank) { const query = venue.searchQuery || venue.name; const mapUrl = searchUrl(query); const placeSearchUrl = naverPlaceSearchUrl(query); const source = venue.savedSource && venue.savedSource !== mapUrl && venue.savedSource !== placeSearchUrl ? `<a class="action" target="_blank" rel="noopener noreferrer" href="${escapeHtml(venue.savedSource)}">레퍼런스</a>` : ''; const menus = venue.menus.length ? `<div class="menus">${venue.menus.map((menu) => `<span class="menu">${escapeHtml(menu)}</span>`).join('')}</div>` : ''; return `<article class="card" style="--accent:${escapeHtml(venue.color)}"><div class="rank">${rank}</div><h2>${escapeHtml(venue.name)}</h2><div class="meta"><span class="chip">${venue.distance}m</span><span class="chip">${escapeHtml(venue.category)}</span></div><p class="reason">${escapeHtml(venue.reason)}</p><div class="info-grid"><div class="info"><b>NAVER SIGNAL</b><span>${escapeHtml(venue.signal)}</span></div><div class="info"><b>ADDRESS</b><span class="address-line">${escapeHtml(venue.address)}</span></div></div>${menus}<div class="card-bottom"><div class="accent-rule"></div><p class="rationale">${escapeHtml(venue.rationale)}</p><div class="actions"><a class="action primary" target="_blank" rel="noopener noreferrer" href="${mapUrl}">네이버 지도</a><a class="action" target="_blank" rel="noopener noreferrer" href="${placeSearchUrl}">검색 링크</a>${source}</div></div></article>`; }
    function quickCopyMarkup(pick) { let copy = escapeHtml(pick.copy); for (const phrase of pick.highlights || []) { const escaped = escapeHtml(phrase); copy = copy.replace(escaped, `<strong>${escaped}</strong>`); } return copy; }
    function renderQuickPicks() { const byName = new Map(modeVenues().map((venue) => [venue.name, venue])); $('#quickPicks').innerHTML = modeConfig[state.mode].quickPicks.map((pick) => { const venue = byName.get(pick.venue); return `<article class="quick"><h2>${escapeHtml(pick.title)}</h2><p><strong>${escapeHtml(venue.name)} ${venue.distance}m</strong>. ${quickCopyMarkup(pick)}</p></article>`; }).join(''); }
    function render() { const mode = modeConfig[state.mode]; const list = filteredVenues(); $('#eyebrow').textContent = config.eyebrow; $('#source').textContent = config.source; $('#notice').textContent = config.notice; $('#markerHelper').textContent = config.markerHelper; $('#candidateCount').textContent = `${list.length} bars`; $('#radiusValue').textContent = mode.radiusLabel; $('#closest').textContent = list.length ? `${list[0].distance}m` : '—'; $('#bestFor').textContent = mode.bestFor; $('#markerTitle').textContent = mode.markerTitle; $('#markerGrid').innerHTML = list.map((venue,index) => `<div class="marker" style="--accent:${escapeHtml(venue.color)}" title="${index + 1}. ${escapeHtml(venue.name)}"><div class="marker-dot"></div><span class="marker-distance">${venue.distance}m</span><span class="marker-name">${escapeHtml(venue.markerLabel)}</span></div>`).join(''); $('#cardList').innerHTML = list.map((venue,index) => cardMarkup(venue,index+1)).join(''); $('#emptyState').style.display = list.length ? 'none' : 'block'; renderTabs(); renderFilters(); renderQuickPicks(); }
    render();
  </script>
</body>
</html>
