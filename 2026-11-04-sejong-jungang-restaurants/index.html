    function buttonMarkup(type, value, label, color, active) { return `<button class="filter${active ? ' is-active' : ''}" type="button" data-${type}="${escapeHtml(value)}">${color ? `<span class="filter-dot" style="--dot:${escapeHtml(color)}"></span>` : ''}${escapeHtml(label)}</button>`; }
    function renderTabs() { const tabs = $('#tabs'); tabs.hidden = modes.length < 2; tabs.innerHTML = modes.map((mode) => `<button class="tab" type="button" role="tab" aria-selected="${mode === state.mode}" data-mode="${mode}">${escapeHtml(modeConfig[mode].label)}</button>`).join(''); tabs.querySelectorAll('[data-mode]').forEach((button) => button.addEventListener('click', () => { state.mode = button.dataset.mode; state.food = 'all'; render(); })); }
    function renderFilters() { $('#distanceFilters').innerHTML = config.distanceFilters.map((filter) => buttonMarkup('distance', filter.value, filter.label, filter.color, state.distance === filter.value)).join(''); const categories = [...new Map(modeVenues().map((venue) => { const [key,label] = foodGroup(venue); return [key, [label, venue.color]]; })).entries()]; $('#foodFilters').innerHTML = buttonMarkup('food', 'all', '전체', null, state.food === 'all') + categories.map(([key,[label,color]]) => buttonMarkup('food', key, label, color, state.food === key)).join(''); document.querySelectorAll('[data-distance]').forEach((button) => button.addEventListener('click', () => { state.distance = button.dataset.distance; render(); })); document.querySelectorAll('[data-food]').forEach((button) => button.addEventListener('click', () => { state.food = button.dataset.food; render(); })); }
    function conciseSignal(value) { return String(value).replace(/\s*·\s*별점\s*(?:미노출|[\d.]+)\s*$/, ''); }
    function foodGroup(venue) { if (venue.category === '이자카야') return ['이자카야', '이자카야/사시미']; if (venue.category === '맥주·호프') return ['맥주', '맥주/하이볼']; if (venue.category === '요리주점') return ['포차', '포차/전골']; if (venue.category === '면 식사') return ['면', '면/우동']; if (venue.category === '해산물 저녁') return ['해산물', '해산물/회']; if (venue.category === '국물 식사') return ['국물', '국물/식사']; if (venue.category === '한식 안주') return ['한식', '한식/안주']; if (venue.category === '파스타 식사') return ['양식', '양식/파스타']; if (venue.category === '돼지고기 저녁') return ['고기', '고기/구이']; if (venue.category === '바') return ['바', '바/맥주']; const category = venue.category || '기타'; return [category, category]; }
    function cardMarkup(venue, rank) { const query = venue.searchQuery || venue.name; const mapUrl = searchUrl(query); const placeSearchUrl = naverPlaceSearchUrl(query); const source = venue.savedSource && venue.savedSource !== mapUrl && venue.savedSource !== placeSearchUrl ? `<a class="action" target="_blank" rel="noopener noreferrer" href="${escapeHtml(venue.savedSource)}">레퍼런스</a>` : ''; const menus = venue.menus.length ? `<div class="menus">${venue.menus.map((menu) => `<span class="menu">${escapeHtml(menu)}</span>`).join('')}</div>` : ''; return `<article class="card" style="--accent:${escapeHtml(venue.color)}"><div class="card-head"><div class="rank">${rank}</div><h2>${escapeHtml(venue.name)}</h2><div class="meta"><span class="chip">${venue.distance}m</span><span class="chip">${escapeHtml(venue.category)}</span>${venue.cardTag ? `<span class="chip">${escapeHtml(venue.cardTag)}</span>` : ''}</div></div><p class="reason">${escapeHtml(venue.reason)}</p><div class="info-grid"><div class="info"><b>NAVER SIGNAL</b><span>${escapeHtml(conciseSignal(venue.signal))}</span></div><div class="info"><b>ADDRESS</b><span class="address-line">${escapeHtml(venue.address)}</span></div></div>${menus}<div class="card-bottom"><div class="accent-rule"></div><p class="rationale">${escapeHtml(venue.rationale)}</p><div class="actions"><a class="action primary" target="_blank" rel="noopener noreferrer" href="${mapUrl}">네이버 지도</a><a class="action" target="_blank" rel="noopener noreferrer" href="${placeSearchUrl}">검색 링크</a>${source}</div></div></article>`; }
    function quickCopyMarkup(pick) { let copy = escapeHtml(pick.copy); for (const phrase of pick.highlights || []) { const escaped = escapeHtml(phrase); copy = copy.replace(escaped, `<strong>${escaped}</strong>`); } return copy; }
    function renderQuickPicks() { const byName = new Map(modeVenues().map((venue) => [venue.name, venue])); $('#quickPicks').innerHTML = modeConfig[state.mode].quickPicks.map((pick) => { const venue = byName.get(pick.venue); return `<article class="quick"><h2>${escapeHtml(pick.title)}</h2><p><strong>${escapeHtml(venue.name)} ${venue.distance}m</strong>. ${quickCopyMarkup(pick)}</p></article>`; }).join(''); }
    function render() { const mode = modeConfig[state.mode]; const list = filteredVenues(); $('#scopePill').textContent = `${config.title} · ${mode.radiusLabel}`; $('#eyebrow').textContent = config.eyebrow; $('#source').textContent = config.source; $('#notice').textContent = config.notice; $('#markerHelper').textContent = config.markerHelper; $('#candidateCount').textContent = config.candidateUnit ? `${list.length}${config.candidateUnit}` : `${list.length} bars`; $('#radiusValue').textContent = mode.radiusLabel; $('#closest').textContent = list.length ? `${list[0].distance}m` : '—'; $('#bestFor').textContent = mode.bestFor; $('#markerTitle').textContent = mode.markerTitle; $('#markerGrid').innerHTML = list.map((venue,index) => `<div class="marker" style="--accent:${escapeHtml(venue.color)}" title="${index + 1}. ${escapeHtml(venue.name)}"><div class="marker-dot"></div><span class="marker-distance">${venue.distance}m</span><span class="marker-name">${escapeHtml(venue.markerLabel)}</span></div>`).join(''); $('#cardList').innerHTML = list.map((venue,index) => cardMarkup(venue,index+1)).join(''); $('#emptyState').style.display = list.length ? 'none' : 'block'; renderTabs(); renderFilters(); renderQuickPicks(); }
    render();
  </script>
</body>
</html>
