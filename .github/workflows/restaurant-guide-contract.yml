name: Restaurant guide contract

on:
  push:
    paths:
      - 'data/restaurant-guides/**'
      - 'scripts/render_restaurant_map.py'
      - 'scripts/render_all_restaurant_guides.py'
      - 'scripts/verify_approved_restaurant_baseline.py'
      - 'scripts/create_restaurant_guide.py'
      - 'templates/restaurant-map-v1.html'
      - 'standards/restaurant-map-contract-v1.json'
      - 'standards/approved-sadang-final-baseline.json'
      - 'tests/test_restaurant_map_*.py'
      - 'tests/test_approved_sadang_final_baseline.py'
      - 'tests/test_verify_approved_restaurant_baseline.py'
      - '.github/workflows/restaurant-guide-contract.yml'
  pull_request:
    paths:
      - 'data/restaurant-guides/**'
      - 'scripts/render_restaurant_map.py'
      - 'scripts/render_all_restaurant_guides.py'
      - 'scripts/verify_approved_restaurant_baseline.py'
      - 'scripts/create_restaurant_guide.py'
      - 'templates/restaurant-map-v1.html'
      - 'standards/restaurant-map-contract-v1.json'
      - 'standards/approved-sadang-final-baseline.json'
      - 'tests/test_restaurant_map_*.py'
      - 'tests/test_approved_sadang_final_baseline.py'
      - 'tests/test_verify_approved_restaurant_baseline.py'
      - '.github/workflows/restaurant-guide-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run restaurant map and approved-final baseline tests
        run: uv run --with pytest pytest -q tests/test_restaurant_map_renderer.py tests/test_restaurant_map_contract.py tests/test_restaurant_map_v2.py tests/test_approved_sadang_final_baseline.py tests/test_verify_approved_restaurant_baseline.py
      - name: Reject stale generated guides, aliases, and archive links
        run: python3 scripts/render_all_restaurant_guides.py --check
      - name: Reject drift from the approved Sadang final baseline
        run: python3 scripts/verify_approved_restaurant_baseline.py
